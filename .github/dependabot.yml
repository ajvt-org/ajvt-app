version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - major
          - minor
          - patch
      next:
        patterns:
          - "next"
          - "eslint-config-next"
        update-types:
          - major
          - minor
          - patch
      react:
        patterns:
          - "react"
          - "react-dom"
        update-types:
          - major
          - minor
          - patch
      react-types:
        patterns:
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - major
          - minor
          - patch
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
        update-types:
          - major
          - minor
          - patch
      npm:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
