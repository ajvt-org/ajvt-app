# CI runs the same audit on every pull request, but only against the lockfile as
# that pull request leaves it. This one catches an advisory published against a
# lockfile nobody has touched, which is the case a per-pull-request run cannot
# see. Overrides in place and why: docs/dependency-overrides.md.
name: Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm audit --audit-level=high
