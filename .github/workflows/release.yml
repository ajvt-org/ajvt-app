# Merging a "Release X.Y.Z" pull request into master tags the merge commit and
# publishes the release with the pull request body as its notes. Every step is
# skipped if it was already done, so a re-run is safe. dev is protected and is
# fast-forwarded onto master by hand.
name: Release

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the release pull request
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: publish
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged &&
       github.event.pull_request.base.ref == 'master' &&
       startsWith(github.event.pull_request.title, 'Release '))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the release off the pull request
        id: release
        run: |
          gh pr view "$PR" --json title,body,baseRefName,mergedAt,mergeCommit > pr.json
          title=$(jq -r .title pr.json)
          base=$(jq -r .baseRefName pr.json)
          merged=$(jq -r '.mergedAt // ""' pr.json)
          sha=$(jq -r '.mergeCommit.oid // ""' pr.json)
          jq -r '.body // ""' pr.json > notes.md

          [ "$base" = "master" ] || { echo "#$PR does not target master"; exit 1; }
          [ -n "$merged" ] && [ -n "$sha" ] || { echo "#$PR is not merged"; exit 1; }

          version=${title#Release }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "#$PR is not titled 'Release X.Y.Z'"; exit 1; }

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Tag the merge
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]; then
            echo "$VERSION is already tagged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin master
          git tag -a "$VERSION" "$SHA" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Publish the release
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION is already released"
            exit 0
          fi
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --notes-file notes.md \
            --verify-tag
