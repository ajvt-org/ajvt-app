# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ajvt
          POSTGRES_PASSWORD: ajvt
          POSTGRES_DB: ajvt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ajvt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        # Next.js 16 requires Node >=20.9.0 (see engines in package.json)

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run lint --if-present
    - run: npm run typecheck
    - run: npm run format:check
    - run: npm run build --if-present
      env:
        # prisma generate + next build never touch a live database (every
        # route that reads/writes data is marked `dynamic`, so nothing runs
        # at build time) — a syntactically valid but unreachable URL is
        # enough. Keeps CI independent of the real production database.
        DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
        JWT_SECRET: "ci-build-only-not-a-real-secret"
    - run: npm test --if-present
    - run: npm run test:api
      env:
        TEST_DATABASE_URL: "postgresql://ajvt:ajvt@localhost:5432/ajvt_test"
