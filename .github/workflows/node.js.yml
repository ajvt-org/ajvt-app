name: CI

on:
  push:
    branches: ["master", "dev"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  BUILD_JWT_SECRET: "ci-build-only-not-a-real-secret"

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  # Separate from static, and allowed to fail, on purpose. An advisory is
  # published against a lockfile that has not changed, so it can turn red on a
  # pull request that has nothing to do with it — including the one release that
  # has to go out now. This makes it visible on every pull request; the weekly
  # Audit workflow is the one that is meant to be acted on.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
      - run: npm audit --audit-level=high

  build:
    name: build
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build
        env:
          DATABASE_URL: ${{ env.BUILD_DATABASE_URL }}
          JWT_SECRET: ${{ env.BUILD_JWT_SECRET }}

  unit:
    name: unit
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm test -- --coverage
      - run: npm run test:ui -- --coverage

      # The floors live in the vitest configs and fail the step above on their
      # own. This only puts the numbers where they can be read without opening
      # the log.
      - if: always()
        run: |
          {
            echo "## Coverage"
            echo
            echo "| suite | statements | branches | functions | lines |"
            echo "| --- | --- | --- | --- | --- |"
            for suite in unit ui; do
              file="coverage/$suite/coverage-summary.json"
              [ -f "$file" ] || continue
              node -e '
                const t = require("./" + process.argv[1]).total;
                const pct = (k) => t[k].pct + "% (" + t[k].covered + "/" + t[k].total + ")";
                console.log("| " + process.argv[2] + " | " + ["statements","branches","functions","lines"].map(pct).join(" | ") + " |");
              ' "$file" "$suite"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  api:
    name: api
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ajvt
          POSTGRES_PASSWORD: ajvt
          POSTGRES_DB: ajvt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ajvt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run test:api
        env:
          TEST_DATABASE_URL: "postgresql://ajvt:ajvt@localhost:5432/ajvt_test"

  e2e:
    name: e2e
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ajvt
          POSTGRES_PASSWORD: ajvt
          POSTGRES_DB: ajvt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ajvt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/cache@v6
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      # Without --with-deps: the runner image already carries what chromium
      # needs, and the apt step it adds has taken longer than the whole job.
      - run: npx playwright install chromium
        timeout-minutes: 8

      - run: npm run build
        env:
          DATABASE_URL: ${{ env.BUILD_DATABASE_URL }}
          JWT_SECRET: ${{ env.BUILD_JWT_SECRET }}

      - run: npm run test:e2e
        env:
          E2E_PRODUCTION: "1"
          E2E_DATABASE_URL: "postgresql://ajvt:ajvt@localhost:5432/ajvt_e2e"
          JWT_SECRET: "ci-e2e-not-a-real-secret"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
