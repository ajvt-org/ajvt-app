services:
  db:
    image: postgres:17-alpine
    container_name: ajvt-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ajvt
      POSTGRES_PASSWORD: ajvt
      POSTGRES_DB: ajvt
    ports:
      - "5433:5432"
    volumes:
      - ajvt-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajvt -d ajvt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ajvt-dev-db:
