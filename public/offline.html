<!doctype html>
<html lang="ar" dir="rtl" data-area="member">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#265c49" />
<title>لا يوجد اتصال بالإنترنت</title>
<style>
  @font-face {
    font-family: "Tajawal";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("/fonts/tajawal-400.woff2") format("woff2");
  }
  @font-face {
    font-family: "Tajawal";
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url("/fonts/tajawal-700.woff2") format("woff2");
  }
  @font-face {
    font-family: "Tajawal";
    font-style: normal;
    font-weight: 800;
    font-display: swap;
    src: url("/fonts/tajawal-800.woff2") format("woff2");
  }
  @font-face {
    font-family: "Tajawal";
    font-style: normal;
    font-weight: 900;
    font-display: swap;
    src: url("/fonts/tajawal-900.woff2") format("woff2");
  }
  :root {
    --mint-50: #f0faf5;
    --mint-600: #357a62;
    --mint-700: #265c49;
    --text-main: #1a2e24;
    --text-muted: #5a7868;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--mint-50);
    color: var(--text-main);
    line-height: 1.6;
    font-family: "Tajawal", "Arial", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .shell {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 1.25rem;
    background: linear-gradient(135deg, var(--mint-700), var(--mint-600));
  }
  .header img { width: 38px; height: 38px; flex-shrink: 0; }
  .header p { margin: 0; font-size: 0.75rem; color: rgba(255, 255, 255, 0.7); }
  .header h1 { margin: 0; font-size: 1rem; font-weight: 900; color: #fff; }
  main {
    flex: 1;
    padding: 1.5rem 1.25rem;
  }
  .card {
    width: 100%;
    padding: 2rem 1.5rem;
    text-align: center;
    background: #fff;
    border-radius: 1.25rem;
    box-shadow: 0 2px 16px rgba(26, 63, 51, 0.08), 0 1px 4px rgba(26, 63, 51, 0.05);
  }
  .halo {
    width: 68px;
    height: 68px;
    margin: 0 auto 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    color: var(--mint-600);
    background: var(--mint-50);
  }
  .card h2 { margin: 0 0 0.5rem; font-size: 1.0625rem; font-weight: 800; }
  .card p { margin: 0 0 1.5rem; font-size: 0.875rem; color: var(--text-muted); }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    border: none;
    padding: 0.85rem 1.75rem;
    border-radius: 0.75rem;
    font-family: inherit;
    font-size: 0.875rem;
    font-weight: 700;
    color: #fff;
    background: var(--mint-600);
    cursor: pointer;
  }
  [data-area="admin"] .header { box-shadow: 0 2px 12px rgba(26, 63, 51, 0.2); }
  [data-area="admin"] .member { display: none; }
  [data-area="member"] .admin { display: none; }
</style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <img src="/logo-mark.svg" alt="شعار" />
      <div class="member">
        <p>رابطة شباب قرية التاكلالت</p>
        <h1>لا يوجد اتصال</h1>
      </div>
      <div class="admin">
        <h1>لوحة تحكم المشرف</h1>
      </div>
    </div>

    <main>
      <div class="card">
        <span class="halo">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM5.6 5.6l12.8 12.8" />
          </svg>
        </span>
        <h2>تعذر تحميل الصفحة</h2>
        <p>تحقق من اتصالك بالشبكة. ستفتح الصفحة من جديد بمجرد عودة الاتصال.</p>
        <button class="btn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6" />
          </svg>
          إعادة المحاولة
        </button>
      </div>
    </main>
  </div>

  <script>
    if (location.pathname.indexOf("/admin") === 0) {
      document.documentElement.setAttribute("data-area", "admin");
    }
    document.querySelector(".btn").addEventListener("click", function () {
      location.reload();
    });
    window.addEventListener("online", function () {
      location.reload();
    });
    setInterval(function () {
      location.reload();
    }, 3000);
  </script>
</body>
</html>
